<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Team MetroMind — Arya Jannawar, Siddhant Pardeshi, Avani Jannawar — top-10 finalist, 4th place overall at the OpenAI DevDay Exchange Metro Hackathon Pune">
  <defs>
    <pattern id="t-g2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1b2430"/>
    </pattern>
    <radialGradient id="t-auA">
      <stop offset="0" stop-color="#29c8cf" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#29c8cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="t-auG">
      <stop offset="0" stop-color="#a183ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a183ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="t-auY">
      <stop offset="0" stop-color="#f2b83b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2b83b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-shine" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#e9edf2"/>
      <stop offset="0.45" stop-color="#e9edf2"/>
      <stop offset="0.5" stop-color="#a4f4f8"/>
      <stop offset="0.55" stop-color="#e9edf2"/>
      <stop offset="1" stop-color="#e9edf2"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-560 0; 660 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="t-swipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29c8cf" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#29c8cf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#29c8cf" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="t-stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29c8cf"/>
      <stop offset="0.5" stop-color="#29c8cf"/>
      <stop offset="0.5" stop-color="#a183ff"/>
      <stop offset="1" stop-color="#a183ff"/>
    </linearGradient>
    <linearGradient id="t-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29c8cf"/>
      <stop offset="0.55" stop-color="#f2b83b"/>
      <stop offset="1" stop-color="#a183ff"/>
    </linearGradient>
    <filter id="t-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="t-soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#0a0d11"/>
  <rect width="1200" height="320" fill="url(#t-g2)"/>

  <!-- ambient halos -->
  <ellipse cx="150" cy="52" rx="240" ry="150" fill="url(#t-auA)" filter="url(#t-soft)"/>
  <ellipse cx="1030" cy="235" rx="260" ry="160" fill="url(#t-auG)" filter="url(#t-soft)"/>
  <ellipse cx="680" cy="26" rx="200" ry="90" fill="url(#t-auY)" filter="url(#t-soft)"/>

  <!-- decorative metro line, right side -->
  <g opacity="0.9">
    <path d="M 748 274 C 880 274 940 246 1010 176 C 1064 122 1102 96 1156 88"
          fill="none" stroke="url(#t-line)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 748 274 C 880 274 940 246 1010 176 C 1064 122 1102 96 1156 88"
          fill="none" stroke="#29c8cf" stroke-width="14" stroke-linecap="round" opacity="0.08" filter="url(#t-soft2)"/>
    <circle cx="748" cy="274" r="9" fill="#0a0d11" stroke="#29c8cf" stroke-width="4"/>
    <circle cx="922" cy="231" r="7" fill="#0a0d11" stroke="#f2b83b" stroke-width="3.5"/>
    <circle cx="1010" cy="176" r="9" fill="#0a0d11" stroke="#f2b83b" stroke-width="4"/>
    <circle cx="1096" cy="108" r="7" fill="#0a0d11" stroke="#a183ff" stroke-width="3.5"/>
    <circle cx="1156" cy="88" r="9" fill="#0a0d11" stroke="#a183ff" stroke-width="4"/>
    <text x="766" y="252" font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="12" letter-spacing="2.5" fill="#5adde2">VANAZ</text>
    <text x="872" y="150" font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="12" letter-spacing="2.5" fill="#f2b83b">DISTRICT COURT</text>
    <text x="1102" y="66" font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="12" letter-spacing="2.5" fill="#c9b8ff">RAMWADI</text>
  </g>

  <!-- eyebrow -->
  <text x="64" y="66" font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="13" letter-spacing="3" fill="#77828f">OPENAI DEVDAY EXCHANGE — METRO HACKATHON PUNE</text>

  <!-- title with highlighter swipe behind METROMIND -->
  <g>
    <rect x="210" y="80" width="372" height="52" rx="12" fill="url(#t-swipe)" transform="rotate(-1.4 596 106)"/>
    <text x="64" y="126" font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="56" font-weight="700" letter-spacing="2" fill="url(#t-shine)">TEAM METROMIND</text>
  </g>

  <!-- aka chip -->
  <g>
    <rect x="640" y="92" width="196" height="32" rx="16" fill="#a183ff" fill-opacity="0.07" stroke="#a183ff" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="660" cy="108" r="4" fill="#a183ff"/>
    <text x="674" y="113" font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#c9b8ff">SQUAD URBANSYNC</text>
  </g>

  <!-- names row, linked by the line -->
  <g font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="17" font-weight="600" fill="#e9edf2">
    <line x1="70" y1="190" x2="676" y2="190" stroke="url(#t-line)" stroke-width="3" opacity="0.55"/>
    <circle cx="70" cy="190" r="5.5" fill="#0a0d11" stroke="#29c8cf" stroke-width="3"/>
    <text x="86" y="196">ARYA JANNAWAR</text>
    <circle cx="332" cy="190" r="5.5" fill="#0a0d11" stroke="#f2b83b" stroke-width="3"/>
    <text x="348" y="196">SIDDHANT PARDESHI</text>
    <circle cx="592" cy="190" r="5.5" fill="#0a0d11" stroke="#a183ff" stroke-width="3"/>
    <text x="608" y="196">AVANI JANNAWAR</text>
  </g>

  <!-- result badges -->
  <g font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
    <rect x="64" y="234" width="196" height="32" rx="16" fill="#f2b83b" fill-opacity="0.07" stroke="#f2b83b" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="84" cy="250" r="4" fill="#f2b83b"/>
    <text x="98" y="255" fill="#f2b83b">TOP 10 FINALIST</text>

    <rect x="274" y="234" width="212" height="32" rx="16" fill="#a183ff" fill-opacity="0.07" stroke="#a183ff" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="294" cy="250" r="4" fill="#a183ff"/>
    <text x="308" y="255" fill="#c9b8ff">4TH PLACE OVERALL</text>

    <rect x="500" y="234" width="256" height="32" rx="16" fill="#29c8cf" fill-opacity="0.06" stroke="#29c8cf" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="520" cy="250" r="4" fill="#29c8cf"/>
    <text x="534" y="255" fill="#5adde2">URBAN MOBILITY TRACK</text>
  </g>

  <!-- base stripe -->
  <rect x="0" y="312" width="1200" height="8" fill="url(#t-stripe)"/>
</svg>
