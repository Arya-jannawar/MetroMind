<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="OpenAI DevDay Exchange Community Event — Metro Hackathon: Pune">
  <defs>
    <pattern id="ev-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1c242e"/>
    </pattern>
  </defs>
  <style>
    .ev-bob{animation:ev-bob 5.6s ease-in-out infinite}
    .ev-blink{animation:ev-blink 4.2s ease-in-out infinite}
    .ev-pulse{animation:ev-pulse 2.6s ease-in-out infinite}
    @keyframes ev-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes ev-blink{0%,88%,100%{opacity:1}94%{opacity:.15}}
    @keyframes ev-pulse{0%,100%{opacity:.85}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.ev-bob,.ev-blink,.ev-pulse{animation:none}}
  </style>

  <rect width="1200" height="540" fill="#0a0d11"/>
  <rect width="1200" height="540" fill="url(#ev-dots)"/>
  <rect x="0" y="0" width="4" height="540" fill="#29c8cf"/>
  <rect x="6" y="0" width="2" height="540" fill="#a183ff" opacity="0.7"/>

  <!-- the event card -->
  <rect x="24" y="24" width="1152" height="446" rx="26" fill="#ffffff"/>

  <!-- card header -->
  <text x="64" y="88" font-family="'Segoe UI',Verdana,sans-serif" font-size="34" font-weight="700" fill="#0f0f0f">OpenAI</text>
  <text x="1136" y="78" text-anchor="end" font-family="'Segoe UI',Verdana,sans-serif" font-size="30" font-weight="700" fill="#0f0f0f">DevDay Exchange</text>
  <text x="1136" y="112" text-anchor="end" font-family="'Segoe UI',Verdana,sans-serif" font-size="30" font-weight="700" fill="#0f0f0f">Community Event</text>

  <!-- circle field -->
  <g font-family="'Segoe UI',Verdana,sans-serif" font-weight="700" fill="#0f0f0f" text-anchor="middle">
    <g class="ev-bob"><circle cx="118" cy="152" r="26" fill="#12a150"/><text x="118" y="161" font-size="19">^ ^</text></g>
    <g class="ev-bob" style="animation-delay:.5s"><circle cx="238" cy="196" r="44" fill="#0a6cff"/><text x="238" y="211" font-size="30" class="ev-blink">&gt; &lt;</text></g>
    <g class="ev-bob" style="animation-delay:1.1s"><circle cx="382" cy="152" r="38" fill="#f4610c"/><text x="382" y="164" font-size="26">– –</text></g>
    <g class="ev-bob" style="animation-delay:.3s"><circle cx="488" cy="236" r="21" fill="#d9dce1"/><text x="488" y="243" font-size="15">* *</text></g>
    <g class="ev-bob" style="animation-delay:1.6s"><circle cx="556" cy="164" r="18" fill="#17181a"/><text x="556" y="171" font-size="14" fill="#ffffff">o</text></g>
    <g class="ev-bob" style="animation-delay:.9s"><circle cx="656" cy="212" r="52" fill="#12a150"/><text x="656" y="228" font-size="34" class="ev-blink" style="animation-delay:1.3s">+ +</text></g>
    <g class="ev-bob" style="animation-delay:1.9s"><circle cx="768" cy="136" r="28" fill="#0a6cff"/><text x="768" y="145" font-size="19">* *</text></g>
    <g class="ev-bob" style="animation-delay:.7s"><circle cx="846" cy="192" r="26" fill="#d9dce1"/><text x="846" y="201" font-size="18">^ ^</text></g>
    <g class="ev-bob" style="animation-delay:1.4s"><circle cx="952" cy="196" r="58" fill="#a259ff"/><text x="952" y="213" font-size="36">o O</text></g>
    <g class="ev-bob" style="animation-delay:.2s"><circle cx="1058" cy="142" r="23" fill="#f4610c"/><text x="1058" y="151" font-size="17" class="ev-blink" style="animation-delay:2.1s">&gt; &lt;</text></g>
    <g class="ev-bob" style="animation-delay:1s"><circle cx="1116" cy="232" r="27" fill="#12a150"/><text x="1116" y="241" font-size="18">!!!</text></g>
    <g class="ev-bob" style="animation-delay:2.3s"><circle cx="330" cy="262" r="29" fill="#f4610c"/><text x="330" y="272" font-size="20">***</text></g>
    <g class="ev-bob" style="animation-delay:.6s"><circle cx="452" cy="272" r="24" fill="#17181a"/><text x="452" y="280" font-size="16" fill="#ffffff">^ ^</text></g>
    <g class="ev-bob" style="animation-delay:1.7s"><circle cx="582" cy="278" r="17" fill="#a259ff"/><text x="582" y="284" font-size="12">&gt; &lt;</text></g>
    <g class="ev-bob" style="animation-delay:1.2s"><circle cx="742" cy="266" r="30" fill="#0a6cff"/><text x="742" y="276" font-size="20">o o</text></g>
    <g class="ev-bob" style="animation-delay:2s"><circle cx="860" cy="262" r="15" fill="#a259ff"/><text x="860" y="267" font-size="11" fill="#ffffff">&lt;3</text></g>
    <g class="ev-bob" style="animation-delay:.8s"><circle cx="986" cy="272" r="33" fill="#12a150"/><text x="986" y="284" font-size="22" class="ev-blink" style="animation-delay:.9s">&gt; &lt;</text></g>
  </g>

  <!-- stray glyphs, like the poster -->
  <text class="ev-pulse" x="170" y="266" font-family="'Segoe UI',Verdana,sans-serif" font-size="26" font-weight="700" fill="#0a6cff">&lt;3</text>
  <text class="ev-pulse" x="912" y="150" font-family="'Segoe UI',Verdana,sans-serif" font-size="24" font-weight="700" fill="#7a8494" style="animation-delay:1.2s">?</text>
  <text class="ev-pulse" x="140" y="118" font-family="'Segoe UI',Verdana,sans-serif" font-size="17" font-weight="700" fill="#12a150" style="animation-delay:.6s">!!!</text>

  <!-- event title -->
  <text x="64" y="386" font-family="'Segoe UI',Verdana,sans-serif" font-size="42" font-weight="700" fill="#0f0f0f">DevDay Exchange Community</text>
  <text x="64" y="436" font-family="'Segoe UI',Verdana,sans-serif" font-size="42" font-weight="700" fill="#0f0f0f">Metro Hackathon: Pune</text>

  <!-- footer on the dark canvas -->
  <g font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" font-size="15" letter-spacing="1">
    <rect x="64" y="496" width="274" height="30" rx="15" fill="#161d26" stroke="#232c37"/>
    <text x="84" y="516" fill="#a7b2bf">Codex Community Events ›</text>
    <text x="1136" y="516" text-anchor="end" fill="#5adde2">BUILT BY TEAM URBANSYNC</text>
  </g>
</svg>
