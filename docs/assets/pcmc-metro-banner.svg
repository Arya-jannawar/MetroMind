<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="A Purple Line metro gliding through the night toward PCMC Bhavan — Codex Dayline, Pune Metro">
  <defs>
    <pattern id="pc-g2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1b2430"/>
    </pattern>
    <radialGradient id="pc-auP">
      <stop offset="0" stop-color="#a183ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a183ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pc-auT">
      <stop offset="0" stop-color="#29c8cf" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#29c8cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b79bff"/>
      <stop offset="0.45" stop-color="#8f6cff"/>
      <stop offset="1" stop-color="#5c3fd0"/>
    </linearGradient>
    <linearGradient id="pc-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a63c9"/>
      <stop offset="1" stop-color="#46318f"/>
    </linearGradient>
    <linearGradient id="pc-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pc-deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3a"/>
      <stop offset="1" stop-color="#161d27"/>
    </linearGradient>
    <linearGradient id="pc-sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a183ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a183ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#a183ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pc-soft3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="pc-soft6" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <style>
    .pc-train{animation:pc-main 6.5s linear infinite}
    .pc-far{animation:pc-far 11.5s linear infinite}
    .pc-streak{stroke-dasharray:34 46;animation:pc-streak 1.6s linear infinite}
    .pc-win{animation:pc-win 2.3s ease-in-out infinite alternate}
    .pc-tw{opacity:0;animation:pc-twinkle 2.7s ease-in-out infinite}
    .pc-glowPulse{animation:pc-strokepulse 2.6s ease-in-out infinite alternate}
    .pc-aur{animation:pc-drift 14s ease-in-out infinite alternate}
    .pc-gridmove{animation:pc-gridpan 7s linear infinite}
    .pc-shim{animation:pc-sweep 10s ease-in-out infinite}
    @keyframes pc-main{from{transform:translateX(-500px)}to{transform:translateX(1290px)}}
    @keyframes pc-far{from{transform:translateX(1300px)}to{transform:translateX(-540px)}}
    @keyframes pc-streak{to{stroke-dashoffset:-480}}
    @keyframes pc-win{from{opacity:.72}to{opacity:1}}
    @keyframes pc-twinkle{0%,100%{opacity:0}50%{opacity:.95}}
    @keyframes pc-strokepulse{from{stroke-opacity:.4}to{stroke-opacity:.95}}
    @keyframes pc-drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,20px) scale(1.15)}}
    @keyframes pc-gridpan{to{transform:translateX(26px)}}
    @keyframes pc-sweep{0%{transform:translateX(-180px) skewX(-18deg)}55%,100%{transform:translateX(1420px) skewX(-18deg)}}
    @media (prefers-reduced-motion:reduce){
      .pc-train{animation:none;transform:translateX(390px)}
      .pc-far{animation:none;transform:translateX(150px)}
      .pc-streak,.pc-shim{animation:none}
      .pc-win{animation:none;opacity:.9}
      .pc-tw{opacity:.7}
      .pc-aur,.pc-gridmove{animation:none}
    }
  </style>

  <rect width="1200" height="260" fill="#0a0d11"/>

  <!-- aurora ambience -->
  <circle class="pc-aur" cx="980" cy="20" r="190" fill="url(#pc-auP)" filter="url(#pc-soft6)"/>
  <circle cx="130" cy="240" r="170" fill="url(#pc-auT)" filter="url(#pc-soft6)"/>

  <!-- drifting dot field -->
  <g class="pc-gridmove"><rect x="-26" y="0" width="1252" height="260" fill="url(#pc-g2)"/></g>

  <!-- context line -->
  <text x="24" y="30" font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" font-size="12" letter-spacing="1.6" fill="#4a5563">CODEX DAYLINE · PUNE METRO · PURPLE LINE NIGHT RUN</text>

  <!-- twinkles -->
  <g fill="#cbb8ff">
    <circle class="pc-tw" cx="420" cy="46" r="2" style="animation-delay:.3s"/>
    <circle class="pc-tw" cx="640" cy="26" r="1.6" style="animation-delay:1.2s"/>
    <circle class="pc-tw" cx="760" cy="70" r="2.2" style="animation-delay:.7s"/>
    <circle class="pc-tw" cx="240" cy="88" r="1.7" style="animation-delay:1.9s"/>
    <circle class="pc-tw" cx="1090" cy="140" r="1.8" style="animation-delay:1.5s"/>
    <circle class="pc-tw" cx="90" cy="140" r="1.6" style="animation-delay:.5s"/>
  </g>

  <!-- skyline -->
  <g fill="#10161e">
    <rect x="30"  y="118" width="56" height="58"/>
    <rect x="98"  y="96"  width="44" height="80"/>
    <rect x="152" y="132" width="62" height="44"/>
    <rect x="226" y="88"  width="38" height="88"/>
    <rect x="274" y="120" width="58" height="56"/>
    <rect x="348" y="104" width="46" height="72"/>
    <rect x="404" y="134" width="66" height="42"/>
    <rect x="484" y="92"  width="40" height="84"/>
    <rect x="536" y="126" width="60" height="50"/>
    <rect x="610" y="100" width="48" height="76"/>
    <rect x="668" y="130" width="64" height="46"/>
    <rect x="744" y="106" width="44" height="70"/>
    <rect x="800" y="128" width="58" height="48"/>
  </g>
  <g fill="#2c3a4b">
    <rect x="110" y="108" width="6" height="6"/><rect x="122" y="108" width="6" height="6"/>
    <rect x="110" y="122" width="6" height="6"/><rect x="236" y="100" width="6" height="6"/>
    <rect x="248" y="100" width="6" height="6"/><rect x="236" y="114" width="6" height="6"/>
    <rect x="360" y="116" width="6" height="6"/><rect x="372" y="130" width="6" height="6"/>
    <rect x="494" y="104" width="6" height="6"/><rect x="506" y="118" width="6" height="6"/>
    <rect x="622" y="112" width="6" height="6"/><rect x="634" y="112" width="6" height="6"/>
    <rect x="754" y="118" width="6" height="6"/><rect x="42"  y="130" width="6" height="6"/>
  </g>

  <!-- station sign -->
  <g font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif">
    <rect x="866" y="34" width="296" height="66" rx="10" fill="#131a26"/>
    <rect class="pc-glowPulse" x="866" y="34" width="296" height="66" rx="10" fill="none" stroke="#a183ff" stroke-width="1.6"/>
    <text x="1014" y="66" text-anchor="middle" font-size="25" font-weight="700" letter-spacing="3" fill="#e9edf2">PCMC BHAVAN</text>
    <text x="1014" y="88" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2" fill="#c9b8ff">PURPLE LINE ⇄ SWARGATE</text>
  </g>

  <!-- speed streaks (world space) -->
  <g stroke="#8f6cff" stroke-width="2" stroke-linecap="round" opacity="0.38">
    <line class="pc-streak" x1="0" y1="118" x2="1200" y2="118" style="animation-delay:0s"/>
    <line class="pc-streak" x1="0" y1="140" x2="1200" y2="140" style="animation-delay:.5s"/>
    <line class="pc-streak" x1="0" y1="158" x2="1200" y2="158" style="animation-delay:.9s"/>
  </g>

  <!-- far track + distant train (right to left) -->
  <line x1="0" y1="170.8" x2="1200" y2="170.8" stroke="#2f3b4b" stroke-width="1.2"/>
  <g class="pc-far" opacity="0.55">
    <g fill="url(#pc-far)">
      <rect x="0"   y="148" width="70" height="22" rx="5"/>
      <rect x="74"  y="148" width="70" height="22" rx="5"/>
      <rect x="148" y="148" width="70" height="22" rx="5"/>
    </g>
    <rect x="8" y="155" width="180" height="7" fill="#0a0d11" opacity="0.55"/>
    <g fill="#9feef1" opacity="0.85">
      <rect x="12" y="156" width="12" height="5"/><rect x="34" y="156" width="12" height="5"/>
      <rect x="86" y="156" width="12" height="5"/><rect x="108" y="156" width="12" height="5"/>
      <rect x="160" y="156" width="12" height="5"/><rect x="182" y="156" width="12" height="5"/>
    </g>
  </g>

  <!-- viaduct -->
  <rect x="0" y="170" width="1200" height="18" fill="url(#pc-deck)"/>
  <line x1="0" y1="176.8" x2="1200" y2="176.8" stroke="#3a4a5e" stroke-width="1.6"/>
  <g fill="#141b24">
    <rect x="118"  y="188" width="12" height="64"/>
    <rect x="364"  y="188" width="12" height="64"/>
    <rect x="610"  y="188" width="12" height="64"/>
    <rect x="856"  y="188" width="12" height="64"/>
    <rect x="1102" y="188" width="12" height="64"/>
  </g>
  <rect x="0" y="252" width="1200" height="8" fill="#080b0e"/>

  <!-- ══ the Purple Line train (left to right) ══ -->
  <g class="pc-train">
    <ellipse cx="210" cy="180" rx="200" ry="7" fill="#a183ff" opacity="0.22" filter="url(#pc-soft6)"/>
    <!-- headlight beam -->
    <path d="M428 146 L560 128 L560 168 Z" fill="url(#pc-beam)"/>
    <!-- cars -->
    <g fill="url(#pc-body)">
      <rect x="0"   y="128" width="132" height="48" rx="9"/>
      <rect x="140" y="128" width="132" height="48" rx="9"/>
      <rect x="280" y="128" width="148" height="48" rx="9"/>
    </g>
    <!-- cab front -->
    <path d="M428 128 L444 146 L444 176 L428 176 Z" fill="#5c3fd0"/>
    <!-- roof line + magenta livery stripe -->
    <rect x="0" y="132" width="444" height="3" fill="#0a0d11" opacity="0.35"/>
    <rect x="0" y="158" width="444" height="4" fill="#ff5fb0"/>
    <rect x="0" y="172" width="444" height="4" fill="#3d2a96"/>
    <!-- window band -->
    <rect x="10" y="140" width="112" height="15" rx="4" fill="#0a0d11" opacity="0.72"/>
    <rect x="150" y="140" width="112" height="15" rx="4" fill="#0a0d11" opacity="0.72"/>
    <rect x="290" y="140" width="104" height="15" rx="4" fill="#0a0d11" opacity="0.72"/>
    <!-- glowing windows -->
    <g class="pc-win" fill="#bfeef2">
      <rect x="16"  y="142" width="14" height="11"/><rect x="40" y="142" width="14" height="11"/>
      <rect x="64"  y="142" width="14" height="11"/><rect x="88" y="142" width="14" height="11"/>
      <rect x="156" y="142" width="14" height="11"/><rect x="180" y="142" width="14" height="11"/>
      <rect x="204" y="142" width="14" height="11"/><rect x="228" y="142" width="14" height="11"/>
      <rect x="296" y="142" width="14" height="11"/><rect x="320" y="142" width="14" height="11"/>
      <rect x="344" y="142" width="14" height="11"/>
    </g>
    <!-- cab window + headlight -->
    <path d="M430 138 L441 150 L441 162 L430 162 Z" fill="#0a0d11"/>
    <circle cx="437" cy="168" r="4.5" fill="#fff6d8" filter="url(#pc-soft3)"/>
    <!-- doors -->
    <g fill="#0a0d11" opacity="0.5">
      <rect x="122" y="136" width="6" height="34"/>
      <rect x="262" y="136" width="6" height="34"/>
      <rect x="402" y="136" width="6" height="34"/>
    </g>
  </g>

  <!-- shimmer across the whole banner -->
  <rect class="pc-shim" x="-160" y="-20" width="130" height="300" fill="url(#pc-sweepG)"/>
</svg>
