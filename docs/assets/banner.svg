<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="MetroMind — an AI commute copilot for the Pune Metro, by Team UrbanSync">
  <defs>
    <pattern id="g2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1b2430"/>
    </pattern>
    <radialGradient id="auA">
      <stop offset="0" stop-color="#29c8cf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#29c8cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auG">
      <stop offset="0" stop-color="#a183ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a183ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#29c8cf" stop-opacity="0.33"/>
      <stop offset="0.7" stop-color="#29c8cf" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#29c8cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wedge" x1="120" y1="20" x2="197" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29c8cf" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#29c8cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineA" gradientUnits="userSpaceOnUse" x1="336" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#e9edf2"/>
      <stop offset="0.45" stop-color="#e9edf2"/>
      <stop offset="0.5" stop-color="#a4f4f8"/>
      <stop offset="0.55" stop-color="#e9edf2"/>
      <stop offset="1" stop-color="#e9edf2"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-500 0; 620 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shineB" gradientUnits="userSpaceOnUse" x1="336" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#29c8cf"/>
      <stop offset="0.45" stop-color="#29c8cf"/>
      <stop offset="0.5" stop-color="#e6fdfe"/>
      <stop offset="0.55" stop-color="#29c8cf"/>
      <stop offset="1" stop-color="#29c8cf"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-500 0; 620 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29c8cf"/>
      <stop offset="0.5" stop-color="#29c8cf"/>
      <stop offset="0.5" stop-color="#a183ff"/>
      <stop offset="1" stop-color="#a183ff"/>
    </linearGradient>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29c8cf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#29c8cf" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#29c8cf" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .e1{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.4,0,.2,1) forwards}
    .nd{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .45s cubic-bezier(.34,1.56,.64,1) forwards}
    .hub{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .8s ease-out .55s forwards}
    .flow2{opacity:0;animation:fadein .8s ease-out 1.5s forwards,drift 1.15s linear infinite}
    .wave{transform-box:fill-box;transform-origin:center;transform:scale(.5);opacity:0;animation:wave 3.3s ease-out infinite}
    .chase{transform-box:fill-box;transform-origin:center;animation:chase 2.8s ease-in-out infinite}
    .core{transform-box:fill-box;transform-origin:center;animation:corepulse 1.7s ease-in-out infinite alternate}
    .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite alternate}
    .aur{animation:aurdrift 13s ease-in-out infinite alternate}
    .aur2{animation:aurdrift2 17s ease-in-out infinite alternate}
    .gridmove{animation:gridpan 7s linear infinite}
    .bob{animation:bob 5.6s ease-in-out infinite}
    .tw{opacity:0;animation:twinkle 2.7s ease-in-out infinite}
    .glowPulse{animation:strokepulse 2.4s ease-in-out infinite alternate}
    .spark{animation:spark 3.4s ease-in-out infinite}
    .sub-b{animation:subb 6s ease-in-out infinite alternate}
    .shim{animation:sweep 9s ease-in-out infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{to{transform:scale(1)}}
    @keyframes drift{to{stroke-dashoffset:-.21}}
    @keyframes fadein{to{opacity:.85}}
    @keyframes wave{0%{transform:scale(.5);opacity:.55}70%{opacity:0}100%{transform:scale(3.3);opacity:0}}
    @keyframes chase{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.35)}}
    @keyframes corepulse{from{transform:scale(.88)}to{transform:scale(1.22)}}
    @keyframes breathe{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1.1)}}
    @keyframes aurdrift{from{transform:translate(0,0) scale(1)}to{transform:translate(-46px,26px) scale(1.18)}}
    @keyframes aurdrift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(38px,-24px) scale(.94)}}
    @keyframes gridpan{to{transform:translateX(26px)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes twinkle{0%,100%{opacity:0}50%{opacity:.95}}
    @keyframes strokepulse{from{stroke-opacity:.35}to{stroke-opacity:.95}}
    @keyframes spark{0%{transform:translateX(0);opacity:0}12%{opacity:.95}45%{opacity:.95}58%{transform:translateX(320px);opacity:0}100%{transform:translateX(320px);opacity:0}}
    @keyframes subb{from{opacity:.7}to{opacity:1}}
    @keyframes sweep{0%{transform:translateX(-180px) skewX(-18deg)}55%,100%{transform:translateX(1420px) skewX(-18deg)}}
    @media (prefers-reduced-motion:reduce){
      .e1,.hub{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
      .nd{transform:none;animation:none}
      .flow2,.wave,.chase,.core,.halo,.aur,.aur2,.gridmove,.bob,.tw,.glowPulse,.spark,.sub-b,.shim{animation:none}
      .flow2{opacity:.85}
      .wave,.tw{opacity:0}
    }
  </style>

  <rect width="1200" height="320" fill="#0a0d11"/>

  <!-- aurora ambience -->
  <circle class="aur" cx="1000" cy="30" r="215" fill="url(#auA)" filter="url(#soft)"/>
  <circle class="aur2" cx="150" cy="315" r="235" fill="url(#auG)" filter="url(#soft)"/>

  <!-- drifting dot field -->
  <g class="gridmove"><rect x="-26" y="0" width="1252" height="320" fill="url(#g2)"/></g>

  <!-- brand edge -->
  <rect x="0" y="0" width="4" height="320" fill="#29c8cf"/>
  <rect x="6" y="0" width="2" height="320" fill="#a183ff" opacity="0.7"/>

  <!-- orbit ring behind the dot cluster -->
  <circle cx="1010" cy="160" r="138" fill="none" stroke="#29c8cf" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 11">
    <animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="42s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkles -->
  <g fill="#9feef1">
    <circle class="tw" cx="712" cy="42" r="2" style="animation-delay:.2s"/>
    <circle class="tw" cx="796" cy="24" r="1.6" style="animation-delay:1.1s"/>
    <circle class="tw" cx="874" cy="66" r="2.4" style="animation-delay:.6s"/>
    <circle class="tw" cx="938" cy="284" r="1.8" style="animation-delay:1.7s"/>
    <circle class="tw" cx="1078" cy="38" r="2" style="animation-delay:2.2s"/>
    <circle class="tw" cx="1150" cy="98" r="1.6" style="animation-delay:.9s"/>
    <circle class="tw" cx="1176" cy="270" r="2.2" style="animation-delay:1.4s"/>
    <circle class="tw" cx="700" cy="286" r="1.7" style="animation-delay:2.5s"/>
    <circle class="tw" cx="336" cy="36" r="1.8" style="animation-delay:1.9s"/>
    <circle class="tw" cx="560" cy="300" r="1.6" style="animation-delay:.4s"/>
  </g>

  <!-- floating event dots -->
  <g opacity="0.8">
    <circle class="bob" cx="1005" cy="86" r="26" fill="#2f6fed"/>
    <circle class="bob" cx="1112" cy="146" r="18" fill="#00a883" style="animation-delay:.8s"/>
    <circle class="bob" cx="1030" cy="212" r="22" fill="#f0731f" style="animation-delay:.4s"/>
    <circle class="bob" cx="1128" cy="64" r="12" fill="#8b5cf6" style="animation-delay:1.2s"/>
    <circle class="bob" cx="1166" cy="216" r="10" fill="#3a4653" style="animation-delay:.6s"/>
  </g>

  <!-- ══ the UrbanSync network mark ══ -->
  <g transform="translate(34,40)">
    <circle class="halo" cx="120" cy="120" r="100" fill="url(#halo)"/>

    <!-- radar sweep around the hub -->
    <g>
      <path d="M120 120 L120 20 A100 100 0 0 1 196.6 55.7 Z" fill="url(#wedge)" filter="url(#soft3)">
        <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- edges: spokes, ring, diagonals (draw in once) -->
    <g stroke="#29c8cf" stroke-width="2.5" stroke-linecap="round" opacity="0.78">
      <line class="e1" pathLength="1" x1="120" y1="120" x2="120" y2="42" style="animation-delay:0ms"/>
      <line class="e1" pathLength="1" x1="120" y1="120" x2="175.2" y2="64.8" style="animation-delay:60ms"/>
      <line class="e1" pathLength="1" x1="120" y1="120" x2="198" y2="120" style="animation-delay:120ms"/>
      <line class="e1" pathLength="1" x1="120" y1="120" x2="175.2" y2="175.2" style="animation-delay:180ms"/>
      <line class="e1" pathLength="1" x1="120" y1="120" x2="120" y2="198" style="animation-delay:240ms"/>
      <line class="e1" pathLength="1" x1="120" y1="120" x2="64.8" y2="175.2" style="animation-delay:300ms"/>
      <line class="e1" pathLength="1" x1="120" y1="120" x2="42" y2="120" style="animation-delay:360ms"/>
      <line class="e1" pathLength="1" x1="120" y1="120" x2="64.8" y2="64.8" style="animation-delay:420ms"/>
      <line class="e1" pathLength="1" x1="120" y1="42" x2="175.2" y2="64.8" style="animation-delay:480ms"/>
      <line class="e1" pathLength="1" x1="175.2" y1="64.8" x2="198" y2="120" style="animation-delay:540ms"/>
      <line class="e1" pathLength="1" x1="198" y1="120" x2="175.2" y2="175.2" style="animation-delay:600ms"/>
      <line class="e1" pathLength="1" x1="175.2" y1="175.2" x2="120" y2="198" style="animation-delay:660ms"/>
      <line class="e1" pathLength="1" x1="120" y1="198" x2="64.8" y2="175.2" style="animation-delay:720ms"/>
      <line class="e1" pathLength="1" x1="64.8" y1="175.2" x2="42" y2="120" style="animation-delay:780ms"/>
      <line class="e1" pathLength="1" x1="42" y1="120" x2="64.8" y2="64.8" style="animation-delay:840ms"/>
      <line class="e1" pathLength="1" x1="64.8" y1="64.8" x2="120" y2="42" style="animation-delay:900ms"/>
      <line class="e1" pathLength="1" x1="120" y1="42" x2="175.2" y2="175.2" style="animation-delay:960ms"/>
      <line class="e1" pathLength="1" x1="120" y1="42" x2="64.8" y2="175.2" style="animation-delay:1020ms"/>
      <line class="e1" pathLength="1" x1="120" y1="198" x2="175.2" y2="64.8" style="animation-delay:1080ms"/>
      <line class="e1" pathLength="1" x1="120" y1="198" x2="64.8" y2="64.8" style="animation-delay:1140ms"/>
    </g>

    <!-- signal packets riding every edge -->
    <g class="flow2" stroke="#a7f4f7" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="0.05 0.16">
      <line pathLength="1" x1="120" y1="120" x2="120" y2="42"/>
      <line pathLength="1" x1="120" y1="120" x2="175.2" y2="64.8"/>
      <line pathLength="1" x1="120" y1="120" x2="198" y2="120"/>
      <line pathLength="1" x1="120" y1="120" x2="175.2" y2="175.2"/>
      <line pathLength="1" x1="120" y1="120" x2="120" y2="198"/>
      <line pathLength="1" x1="120" y1="120" x2="64.8" y2="175.2"/>
      <line pathLength="1" x1="120" y1="120" x2="42" y2="120"/>
      <line pathLength="1" x1="120" y1="120" x2="64.8" y2="64.8"/>
      <line pathLength="1" x1="120" y1="42" x2="175.2" y2="64.8"/>
      <line pathLength="1" x1="175.2" y1="64.8" x2="198" y2="120"/>
      <line pathLength="1" x1="198" y1="120" x2="175.2" y2="175.2"/>
      <line pathLength="1" x1="175.2" y1="175.2" x2="120" y2="198"/>
      <line pathLength="1" x1="120" y1="198" x2="64.8" y2="175.2"/>
      <line pathLength="1" x1="64.8" y1="175.2" x2="42" y2="120"/>
      <line pathLength="1" x1="42" y1="120" x2="64.8" y2="64.8"/>
      <line pathLength="1" x1="64.8" y1="64.8" x2="120" y2="42"/>
      <line pathLength="1" x1="120" y1="42" x2="175.2" y2="175.2"/>
      <line pathLength="1" x1="120" y1="42" x2="64.8" y2="175.2"/>
      <line pathLength="1" x1="120" y1="198" x2="175.2" y2="64.8"/>
      <line pathLength="1" x1="120" y1="198" x2="64.8" y2="64.8"/>
    </g>

    <!-- breathing waves from the hub -->
    <circle class="wave" cx="120" cy="120" r="30" fill="none" stroke="#29c8cf" stroke-width="2" style="animation-delay:0s"/>
    <circle class="wave" cx="120" cy="120" r="30" fill="none" stroke="#29c8cf" stroke-width="2" style="animation-delay:1.1s"/>
    <circle class="wave" cx="120" cy="120" r="30" fill="none" stroke="#29c8cf" stroke-width="2" style="animation-delay:2.2s"/>

    <!-- satellite stations, inner lights chase around the ring -->
    <g class="nd" style="animation-delay:.72s"><circle cx="120" cy="42" r="8.5" fill="#0a0d11" stroke="#29c8cf" stroke-width="2.6"/><circle class="chase" cx="120" cy="42" r="3.4" fill="#c2f7f9" style="animation-delay:2.0s"/></g>
    <g class="nd" style="animation-delay:.78s"><circle cx="175.2" cy="64.8" r="8.5" fill="#0a0d11" stroke="#29c8cf" stroke-width="2.6"/><circle class="chase" cx="175.2" cy="64.8" r="3.4" fill="#c2f7f9" style="animation-delay:2.35s"/></g>
    <g class="nd" style="animation-delay:.84s"><circle cx="198" cy="120" r="8.5" fill="#0a0d11" stroke="#29c8cf" stroke-width="2.6"/><circle class="chase" cx="198" cy="120" r="3.4" fill="#c2f7f9" style="animation-delay:2.7s"/></g>
    <g class="nd" style="animation-delay:.9s"><circle cx="175.2" cy="175.2" r="8.5" fill="#0a0d11" stroke="#29c8cf" stroke-width="2.6"/><circle class="chase" cx="175.2" cy="175.2" r="3.4" fill="#c2f7f9" style="animation-delay:3.05s"/></g>
    <g class="nd" style="animation-delay:.96s"><circle cx="120" cy="198" r="8.5" fill="#0a0d11" stroke="#29c8cf" stroke-width="2.6"/><circle class="chase" cx="120" cy="198" r="3.4" fill="#c2f7f9" style="animation-delay:3.4s"/></g>
    <g class="nd" style="animation-delay:1.02s"><circle cx="64.8" cy="175.2" r="8.5" fill="#0a0d11" stroke="#29c8cf" stroke-width="2.6"/><circle class="chase" cx="64.8" cy="175.2" r="3.4" fill="#c2f7f9" style="animation-delay:3.75s"/></g>
    <g class="nd" style="animation-delay:1.08s"><circle cx="42" cy="120" r="8.5" fill="#0a0d11" stroke="#29c8cf" stroke-width="2.6"/><circle class="chase" cx="42" cy="120" r="3.4" fill="#c2f7f9" style="animation-delay:4.1s"/></g>
    <g class="nd" style="animation-delay:1.14s"><circle cx="64.8" cy="64.8" r="8.5" fill="#0a0d11" stroke="#29c8cf" stroke-width="2.6"/><circle class="chase" cx="64.8" cy="64.8" r="3.4" fill="#c2f7f9" style="animation-delay:4.45s"/></g>

    <!-- the interchange hub -->
    <circle class="hub" cx="120" cy="120" r="21" fill="#0a0d11" stroke="#e9edf2" stroke-width="3.2" pathLength="1"/>
    <g class="nd" style="animation-delay:.95s">
      <circle cx="120" cy="120" r="13" fill="none" stroke="#29c8cf" stroke-width="2.4"/>
      <circle class="core" cx="120" cy="120" r="6" fill="#eafffb" style="filter:drop-shadow(0 0 8px rgba(41,200,207,.95))"/>
    </g>
  </g>

  <!-- wordmark with travelling chrome shine -->
  <text x="336" y="122" font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="56" font-weight="700" letter-spacing="2" fill="url(#shineA)">METRO<tspan fill="url(#shineB)">MIND</tspan></text>
  <text class="sub-b" x="338" y="158" font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="19" fill="#a7b2bf">An AI commute copilot for the Pune Metro — state the goal, read the reasoning.</text>

  <!-- chips -->
  <g font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1.2">
    <rect x="338" y="176" width="172" height="30" rx="15" fill="#29c8cf" fill-opacity="0.08"/>
    <rect class="glowPulse" x="338" y="176" width="172" height="30" rx="15" fill="none" stroke="#29c8cf"/>
    <text x="358" y="196" fill="#5adde2">TEAM URBANSYNC</text>
    <rect x="524" y="176" width="404" height="30" rx="15" fill="#161d26" stroke="#232c37"/>
    <text x="544" y="196" fill="#a7b2bf">OPENAI DEVDAY EXCHANGE · METRO HACKATHON PUNE</text>
  </g>

  <!-- underline stripe with a running spark -->
  <rect x="338" y="228" width="380" height="4" rx="2" fill="url(#stripe)"/>
  <rect class="spark" x="338" y="228" width="60" height="4" rx="2" fill="#f4ffff" filter="url(#soft3)"/>

  <text x="338" y="272" font-family="'IBM Plex Sans','Segoe UI',Verdana,sans-serif" font-size="15" fill="#77828f">Arya Jannawar · Siddhant Pardeshi · Avani Jannawar</text>

  <!-- shimmer across the whole banner -->
  <rect class="shim" x="-160" y="-20" width="130" height="360" fill="url(#sweepG)"/>
</svg>
